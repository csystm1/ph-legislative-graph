services:
  postgres:
    image: postgres:15
    container_name: phlg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phlg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phlg}
      POSTGRES_DB: ${POSTGRES_DB:-phlg}
    ports:
      - "5432:5432"
    volumes:
      - phlg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  phlg-pgdata:
    name: phlg-pgdata